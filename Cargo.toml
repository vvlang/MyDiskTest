[package]
name = "mydisktest"
version = "1.5.1"
edition = "2021"
authors = ["AIYeon"]
description = "Cross-platform modern MyDiskTest replacement for Windows and macOS — fake capacity detection, integrity verification, bad block scan, speed benchmark, and burn-in testing."
license = "MIT"

[[bin]]
name = "mydisktest"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
egui = "0.31"
egui_plot = "0.31"
chrono = { version = "0.4", features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
encoding_rs = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
